<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="full-cyan-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Cyan Gradient for C and Glow -->
    <linearGradient id="full-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="full-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="35%" stop-color="#00B4D8" />
      <stop offset="70%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <!-- Background Glow Aura -->
  <rect x="120" y="30" width="360" height="360" rx="80" stroke="#00F2FE" stroke-width="20" opacity="0.4" filter="url(#full-cyan-glow)" />

  <!-- Outer Rounded Window Container -->
  <rect x="120" y="30" width="360" height="360" rx="80" fill="#FFFFFF" />
  <rect x="120" y="30" width="360" height="360" rx="80" stroke="url(#full-border-grad)" stroke-width="16" />

  <!-- Browser Header Bar Inside -->
  <g fill="#00B4D8">
    <rect x="165" y="78" width="14" height="14" rx="2.5" />
    <rect x="187" y="78" width="14" height="14" rx="2.5" />
    <rect x="209" y="78" width="14" height="14" rx="2.5" />
    <rect x="238" y="76" width="195" height="18" rx="5" />
  </g>
  <line x1="155" y1="108" x2="445" y2="108" stroke="#00B4D8" stroke-width="5" stroke-linecap="round" />

  <!-- Stylized F -->
  <path d="M175 140 H290 V186 H220 V215 H280 V260 H220 V335 H175 Z" fill="#0A2540" />

  <!-- Stylized C -->
  <path d="M420 185 C400 155 365 140 325 140 C260 140 220 190 220 252 C220 315 260 365 325 365 C370 365 405 345 425 315 L385 285 C372 305 352 320 325 320 C285 320 268 288 268 252 C268 215 285 185 325 185 C352 185 372 198 385 220 Z" fill="url(#full-cyan-grad)" />

  <!-- Typography underneath -->
  <text x="300" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="58" fill="#0A2540" text-anchor="middle" letter-spacing="-1">
    FC Web
  </text>
  <text x="300" y="530" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="52" fill="#0A2540" text-anchor="middle" letter-spacing="1">
    Designer
  </text>
</svg>
